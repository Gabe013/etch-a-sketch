<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabe's Etch-a-Sketch Spinoff</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Etch-a-Sketch Spinoff</h1>
    <button>(Re)generate grid</button>
    <div class="container">
    </div>
    <script>
        const gridButton = document.querySelector("button");
        const container = document.querySelector(".container");
        gridButton.addEventListener("click", function () {
            if (container.innerHTML != "") {
                container.innerHTML = "";
            }
            const gridSize = parseInt(prompt("Please enter a number of total squares in the container:", 40));
            if (gridSize > 100) {alert("Please enter a number smaller than or equal to 100!")} else { 
            for (let i = 0; i < (gridSize * gridSize); i++) {
                const square = document.createElement("div");
                square.classList.toggle("square");
                const squareSize = 650 / gridSize;
                square.style.width = squareSize + "px";
                square.style.height = squareSize + "px";
                container.appendChild(square);
            }}
        });
    </script>
</body>

</html>
