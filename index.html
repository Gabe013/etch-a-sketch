<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabe's Etch-a-Sketch Spinoff</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Etch-a-Sketch Spinoff</h1>
    <button>(Re)generate grid</button>
    <div class="container">
    </div>
    <script>
        const gridButton = document.querySelector("button");
        const container = document.querySelector(".container");
        const containerWidth = container.clientWidth;
        let buttonClicked = false;
        gridButton.addEventListener("click", () => {
            if (buttonClicked) {
                container.innerHTML = "";
            }
            let gridSize = Number(prompt("Please enter a whole number of total squares in the container divisible by 960:", 40));
            if (!gridSize || gridSize < 0 || gridSize > 100 || !Number.isInteger(gridSize)) { alert("Please enter a whole number smaller than or equal to 100, but divisible by 960!") }
            else if (containerWidth % gridSize !== 0) { alert("Please enter a number divisible by 960! E.g. 20, 40, 60, etc."); } else {
                for (let i = 0; i < (gridSize * gridSize); i++) {
                    const square = document.createElement("div");
                    square.classList.toggle("square");
                    square.style.width = `${containerWidth / gridSize}px`;
                    square.style.height = `${containerWidth / gridSize}px`;
                    square.style.opacity = 0.1;
                    container.appendChild(square);
                    buttonClicked = true;
                }
            }
            function getRandomRGB() {
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                return `rgb(${r}, ${g}, ${b})`;
            }

            const allSquares = container.childNodes;
            allSquares.forEach((square) => {
                square.addEventListener("mouseenter", (event) => {
                    event.target.style.backgroundColor = getRandomRGB();
                    let currentOpacity = parseFloat(square.style.opacity); // creating a floating point value out of the opacity value for the next line of code
                    if (currentOpacity < 1) {
                        square.style.opacity = (currentOpacity + 0.1); // removed the .toString() method from the original code, why would it be there?!
                    }
                });
            })
        });
    </script>
</body>

</html>
